<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockAI Pro | Global Institutional Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://s3.tradingview.com/tv.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

        :root {
            --bg-ultra: #02040a;
            --sidebar-bg: #0d1117;
            --card-bg: #0d1117;
            --accent-glow: #2f81f7;
            --accent-soft: rgba(47, 129, 247, 0.1);
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --success: #238636;
            --danger: #da3633;
            --warning: #d29922;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s ease; }
        body { margin: 0; background: var(--bg-ultra); color: var(--text-primary); overflow: hidden; height: 100vh; }

        /* --- AUTHENTICATION --- */
        .login-page { height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #161b22 0%, #02040a 100%); position: fixed; width: 100%; z-index: 10000; }
        .login-card { background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(20px); padding: 50px; border-radius: 24px; border: 1px solid var(--border-color); width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .login-card input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--border-color); background: #010409; color: white; font-size: 1rem; outline: none; text-align: center; }
        
        /* --- MAIN LAYOUT --- */
        .terminal-container { display: grid; grid-template-columns: 70px 1fr; height: 100vh; }
        .nav-rail { background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 25px; }
        .nav-rail .icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; color: var(--text-secondary); font-size: 1.2rem; }
        .nav-rail .icon.active { background: var(--accent-soft); color: var(--accent-glow); border: 1px solid var(--accent-glow); }

        .main-stage { overflow-y: auto; display: flex; flex-direction: column; height: 100vh; background: #010409; }
        .ticker-header { width: 100%; height: 42px; border-bottom: 1px solid var(--border-color); background: #000; }

        .terminal-header { padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; background: var(--sidebar-bg); border-bottom: 1px solid var(--border-color); z-index: 100; }
        .search-group { display: flex; background: #010409; border: 1px solid var(--border-color); border-radius: 6px; padding: 2px; }
        .search-group input { background: transparent; border: none; color: white; padding: 8px 12px; width: 200px; outline: none; font-family: 'JetBrains Mono'; font-size: 0.8rem; }
        .btn-analyze { background: var(--accent-glow); color: white; border: none; border-radius: 4px; padding: 6px 15px; cursor: pointer; font-weight: 700; font-size: 0.7rem; text-transform: uppercase; }

        /* --- GRID SYSTEM --- */
        .terminal-grid { display: grid; grid-template-columns: 1fr 380px; gap: 15px; padding: 15px; }
        .glass-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; position: relative; }
        
        /* --- NEWS TERMINAL WRAPPER --- */
        .market-intelligence-wrapper { 
            border: 1px solid #334155; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #131722; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            margin-top: 15px;
        }

        /* --- LEDGER --- */
        .view-content { animation: fadeIn 0.3s ease; height: 100%; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hidden { display: none !important; }
        .portfolio-view { padding: 20px 30px; }
        
        .ledger-table { width: 100%; border-collapse: collapse; }
        .ledger-table th { text-align: left; color: var(--text-secondary); font-size: 0.65rem; padding: 15px; border-bottom: 1px solid var(--border-color); text-transform: uppercase; }
        .ledger-table td { padding: 15px; border-bottom: 1px solid #161b22; font-size: 0.85rem; }
        .ledger-row:hover { background: rgba(255,255,255,0.02); }

        .pulse { animation: pulse-anim 2s infinite; }
        @keyframes pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="login-page" id="loginPage">
        <div class="login-card">
            <h1 style="margin: 0; font-weight: 800; letter-spacing: -1.5px;">STOCK<span style="color: var(--accent-glow)">AI</span></h1>
            <p style="color: var(--text-secondary); margin-bottom: 25px; font-size: 0.7rem; letter-spacing: 2px;">ENCRYPTED TERMINAL v4.0</p>
            <input id="user" placeholder="OPERATOR ID" value="ADMIN-99">
            <input id="pass" type="password" placeholder="SECURITY KEY" value="admin123">
            <button class="btn-analyze" style="width: 100%; padding: 14px;" onclick="handleLogin()">Authorize Entry</button>
            <p id="loginErr" style="color: var(--danger); font-size: 0.7rem; margin-top: 15px; font-family: 'JetBrains Mono';"></p>
        </div>
    </div>

    <div class="terminal-container" id="mainDashboard" style="display: none;">
        <aside class="nav-rail">
            <div class="icon active" id="nav-market" onclick="switchTab('market')" title="Market Intel">📊</div>
            <div class="icon" id="nav-portfolio" onclick="switchTab('portfolio')" title="Asset Ledger">💼</div>
            <div class="icon" style="margin-top: auto; color: var(--danger);" onclick="location.reload()">🔒</div>
        </aside>

        <main class="main-stage">
            <div class="ticker-header" id="ticker-container"></div>

            <header class="terminal-header">
                <div>
                    <h2 id="header-title" style="margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: -0.5px;">Market Intelligence</h2>
                </div>
                
                <div class="search-group">
                    <input id="stockSearch" placeholder="SEARCH TICKER...">
                    <button class="btn-analyze" onclick="updateView()">Execute</button>
                </div>
            </header>

            <div id="view-market" class="view-content">
                <div class="terminal-grid">
                    <div style="display: flex; flex-direction: column;">
                        <div class="glass-card" id="tv-chart-main" style="height: 500px;"></div>
                        
                        <div class="market-intelligence-wrapper">
                            <div style="background: #1e222d; padding: 12px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
                                <span style="color: #d1d4dc; font-weight: bold; font-family: sans-serif; font-size: 14px; letter-spacing: 1px;">INSTITUTIONAL NEWS WIRE</span>
                                <span style="color: #2962ff; font-size: 12px; font-weight: bold;">LIVE FEED</span>
                            </div>

                            <div id="news-container" style="height: 400px;">
                                </div>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        <div class="glass-card" style="padding: 20px;">
                            <div style="font-size: 0.65rem; font-weight: 800; color: var(--text-secondary); margin-bottom: 15px;">NEURAL CORE SIGNAL</div>
                            <div style="text-align:center; padding: 20px; background: #010409; border-radius: 8px; border: 1px solid var(--border-color);">
                                <div id="predictVal" style="font-size: 1.5rem; font-weight: 800; color: var(--text-secondary);">STANDBY</div>
                                <div id="predictMeta" style="font-size: 0.65rem; color: var(--text-secondary); margin-top: 5px;">Ready for analysis...</div>
                            </div>
                            <div style="margin-top: 15px;">
                                <div style="display:flex; justify-content:space-between; padding: 8px 0; font-size: 0.75rem; border-bottom: 1px solid #161b22;">
                                    <span style="color:var(--text-secondary)">Neural Conf.</span><span id="ai-prob" style="font-family:'JetBrains Mono'">--</span>
                                </div>
                            </div>
                        </div>

                        <div class="glass-card" style="flex-grow: 1; min-height: 400px;">
                            <div style="padding: 10px 15px; font-size: 0.65rem; font-weight: 800; color: var(--text-secondary); border-bottom: 1px solid var(--border-color);">MARKET MOVERS</div>
                            <div id="movers-container" style="height: 100%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="view-portfolio" class="view-content hidden">
                <div class="portfolio-view">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                        <h2 style="margin:0; font-size: 1.5rem;">Asset Ledger</h2>
                        <div class="search-group">
                            <input id="assetInput" placeholder="ADD SYMBOL...">
                            <button class="btn-analyze" onclick="addAsset()">Add</button>
                        </div>
                    </div>
                    <div class="glass-card">
                        <table class="ledger-table">
                            <thead>
                                <tr>
                                    <th>Security</th>
                                    <th>Status</th>
                                    <th>Current Price</th>
                                    <th>24H Change</th>
                                    <th>Management</th>
                                </tr>
                            </thead>
                            <tbody id="assetTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

<script>
    let currentTicker = "NASDAQ:AAPL";
    let myAssets = JSON.parse(localStorage.getItem('stockai_ledger')) || ["AAPL", "NVDA", "TSLA", "BTCUSD"];

    function handleLogin() {
        if(user.value && pass.value === "admin123") {
            loginPage.style.display = "none";
            mainDashboard.style.display = "grid";
            initTickerTape();
            initMovers();
            renderLedger();
            setTimeout(() => { updateView(true); }, 300);
        } else {
            loginErr.innerText = "ACCESS DENIED: INVALID CREDENTIALS";
        }
    }

    function initTickerTape() {
        const script = document.createElement('script');
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
        script.async = true;
        script.innerHTML = JSON.stringify({
            "symbols": [{"proName":"NASDAQ:AAPL"},{"proName":"NASDAQ:TSLA"},{"proName":"BINANCE:BTCUSDT"},{"proName":"NASDAQ:NVDA"}],
            "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "en"
        });
        document.getElementById('ticker-container').appendChild(script);
    }

    function initMovers() {
        const script = document.createElement('script');
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-hotlists.js";
        script.async = true;
        script.innerHTML = JSON.stringify({
            "colorTheme": "dark", "dateRange": "12M", "exchange": "US", "showChart": false, "width": "100%", "height": "100%", "isTransparent": true
        });
        document.getElementById('movers-container').appendChild(script);
    }

    function injectNews(symbol) {
        const container = document.getElementById('news-container');
        container.innerHTML = ''; // Clear existing widget
        const script = document.createElement('script');
        script.src = "https://s3.tradingview.com/external-embedding/embed-widget-timeline.js";
        script.async = true;
        script.innerHTML = JSON.stringify({
            "feedMode": "symbol",
            "symbol": symbol,
            "isTransparent": true,
            "displayMode": "regular",
            "width": "100%",
            "height": "100%",
            "colorTheme": "dark",
            "locale": "en"
        });
        container.appendChild(script);
    }

    function updateView(force = false) {
        let ticker = currentTicker;
        if(!force) {
            const inputVal = document.getElementById('stockSearch').value.toUpperCase().trim();
            if(!inputVal) return;
            ticker = inputVal;
        }
        
        currentTicker = ticker;
        injectNews(ticker); // Updates News Terminal

        new TradingView.widget({
            "autosize": true, "symbol": ticker, "interval": "D", "theme": "dark",
            "style": "1", "container_id": "tv-chart-main", "backgroundColor": "#0d1117",
            "hide_top_toolbar": false, "allow_symbol_change": true, "save_image": false
        });

        const val = document.getElementById('predictVal');
        val.innerText = "ANALYZING...";
        val.style.color = "var(--warning)";
        val.classList.add('pulse');

        setTimeout(() => {
            const isUp = Math.random() > 0.5;
            val.classList.remove('pulse');
            val.innerText = isUp ? "STRONG BUY" : "REDUCE";
            val.style.color = isUp ? "#3fb950" : "#f85149";
            document.getElementById('predictMeta').innerText = "Signal confirmed for " + ticker;
            document.getElementById('ai-prob').innerText = (Math.random() * 15 + 82).toFixed(2) + "%";
        }, 1200);
    }

    function switchTab(tab) {
        document.getElementById('view-market').classList.toggle('hidden', tab !== 'market');
        document.getElementById('view-portfolio').classList.toggle('hidden', tab !== 'portfolio');
        document.getElementById('nav-market').classList.toggle('active', tab === 'market');
        document.getElementById('nav-portfolio').classList.toggle('active', tab === 'portfolio');
        document.getElementById('header-title').innerText = tab === 'market' ? 'Market Intelligence' : 'Asset Ledger';
    }

    function renderLedger() {
        const body = document.getElementById('assetTable');
        body.innerHTML = '';
        myAssets.forEach((asset, index) => {
            const price = (Math.random() * 500 + 100).toFixed(2);
            const change = (Math.random() * 4 - 2).toFixed(2);
            body.innerHTML += `
                <tr class="ledger-row">
                    <td onclick="viewSymbol('${asset}')" style="cursor:pointer; font-weight:700; color:var(--accent-glow)">${asset}</td>
                    <td><span style="font-size:0.6rem; background:var(--accent-soft); color:var(--accent-glow); padding:2px 6px; border-radius:4px;">TRACKING</span></td>
                    <td style="font-family:'JetBrains Mono'">$${price}</td>
                    <td style="font-family:'JetBrains Mono'; color:${change >= 0 ? 'var(--success)' : 'var(--danger)'}">${change}%</td>
                    <td><button onclick="removeAsset(${index})" style="background:transparent; border:1px solid var(--danger); color:var(--danger); cursor:pointer; font-size:0.6rem; border-radius:4px; padding:3px 8px;">TERMINATE</button></td>
                </tr>`;
        });
        localStorage.setItem('stockai_ledger', JSON.stringify(myAssets));
    }

    function addAsset() {
        const val = document.getElementById('assetInput').value.toUpperCase().trim();
        if(val && !myAssets.includes(val)) {
            myAssets.push(val);
            renderLedger();
            document.getElementById('assetInput').value = '';
        }
    }

    function removeAsset(index) {
        myAssets.splice(index, 1);
        renderLedger();
    }

    function viewSymbol(s) {
        document.getElementById('stockSearch').value = s;
        switchTab('market');
        updateView();
    }
</script>
</body>
</html>
