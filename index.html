<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>StockAI Pro | Institutional Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- External Resources -->
  <script src="https://s3.tradingview.com/tv.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

  <!-- LOGIN OVERLAY -->
  <div id="login-screen" class="login-overlay" style="z-index:9999;">
    <div class="login-card">
      <div style="font-size:3rem; margin-bottom:20px;">💎</div>
      <h2 style="margin-bottom:10px;">Institutional Access v2.1</h2>
      <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:30px;">Secure Terminal Gateway</p>
      <input type="password" class="login-input" placeholder="ACCESS KEY">
      <button class="btn-primary" style="width:100%; margin-bottom:15px;" onclick="handleLogin()">AUTHENTICATE</button>
      <div style="font-size:0.75rem; color:var(--text-secondary); cursor:pointer; text-decoration:underline;"
        onclick="bypassLogin()">Trouble connecting? Bypass Login</div>
    </div>
  </div>

  <div class="app-container" id="mainDashboard" style="display:none;">

    <!-- SIDE NAVIGATION (DESKTOP) -->
    <aside class="nav-rail">
      <div class="nav-item active" id="nav-market-desktop" onclick="switchTab('market')" title="Market Intelligence">
        📊
      </div>
      <div class="nav-item" id="nav-portfolio-desktop" onclick="switchTab('portfolio')" title="Portfolio & Assets">
        💼
      </div>
      <div class="nav-item" style="margin-top:auto; color:var(--accent-danger);" onclick="handleLogout()"
        title="Secure Logout">
        🔒
      </div>
    </aside>

    <!-- MAIN AREA -->
    <main class="main-content">
      <!-- TICKER TAPE -->
      <div class="ticker-wrapper" id="ticker-container"
        style="height:46px; border-bottom:1px solid var(--border-subtle); overflow:hidden;">
        <!-- TradingView Ticker injected here -->
      </div>

      <!-- TOP BAR -->
      <header class="top-bar">
        <div class="brand">
          <span style="color:var(--accent-glow);">STOCK</span>AI PRO
        </div>

        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="stockSearch" placeholder="SEARCH TICKER (e.g. AAPL)">
        </div>
      </header>

      <!-- SCROLLABLE CONTENT -->
      <div class="scrollable-area">

        <!-- VIEW: MARKET INTELLIGENCE -->
        <div id="view-market" class="view-section">
          <div class="dashboard-grid">

            <!-- LEFT COLUMN (CHARTS & NEWS) -->
            <div class="main-column" style="display:flex; flex-direction:column; gap:20px;">

              <!-- CHART CARD -->
              <div class="glass-card" style="min-height: 500px;" id="chart-card-container">
                <div class="card-header">
                  <span class="card-title" id="terminal-symbol">NASDAQ:AAPL</span>
                  <div class="live-indicator">
                    <div class="pulse-dot"></div> LIVE MARKET
                  </div>
                </div>
                <div class="card-body chart-wrapper">
                  <div id="tv-chart-main" style="width:100%; height:100%;"></div>
                </div>
              </div>

              <!-- NEWS CARD -->
              <div class="glass-card">
                <div class="card-header">
                  <span class="card-title">Institutional Wire</span>
                </div>
                <div class="card-body" style="height: 400px;">
                  <div id="news-container" style="width:100%; height:100%;"></div>
                </div>
              </div>
            </div>

            <!-- RIGHT COLUMN (SIDEBAR WIDGETS) -->
            <aside class="side-column" style="display:flex; flex-direction:column; gap:20px;">

              <!-- AI PREDICTION CARD -->
              <div class="glass-card">
                <div class="card-header">
                  <span class="card-title">Neural Output</span>
                  <span class="font-mono" style="font-size:0.7rem; color:var(--accent-glow);" id="ai-prob">--%</span>
                </div>
                <div class="card-body ai-signal-box">
                  <div id="predictMeta" class="signal-sub">System Standby</div>
                  <div id="predictVal" class="signal-value" style="color:var(--text-muted);">INITIALIZING</div>

                  <div
                    style="margin-top:15px; background:rgba(255,255,255,0.1); height:4px; border-radius:2px; overflow:hidden;">
                    <div id="confidence-bar"
                      style="width:0%; height:100%; background:var(--accent-glow); transition:width 1s ease;"></div>
                  </div>
                </div>
              </div>

              <!-- MARKET MOVERS CARD -->
              <div class="glass-card" style="flex:1;">
                <div class="card-header">
                  <span class="card-title">Active Volatility</span>
                </div>
                <div class="card-body" style="height:100%; min-height:400px;">
                  <div id="movers-container" style="width:100%; height:100%;"></div>
                </div>
              </div>

            </aside>
          </div>
        </div> <!-- END MARKET VIEW -->

        <!-- VIEW: PORTFOLIO -->
        <div id="view-portfolio" class="view-section hidden">
          <div class="glass-card">
            <div class="card-header">
              <span class="card-title">Asset Ledger</span>
              <div style="display:flex; gap:10px;">
                <input id="assetInput" placeholder="SYMBOL"
                  style="background:transparent; border:1px solid var(--border-subtle); color:white; padding:4px 8px; border-radius:4px; font-family:var(--font-mono); text-transform:uppercase; width:80px;">
                <button class="btn-primary" onclick="addAsset()"
                  style="padding:4px 10px; font-size:0.75rem;">ADD</button>
              </div>
            </div>
            <div class="card-body p-0">
              <div id="assetTable" style="width:100%;"></div>
            </div>
          </div>
        </div> <!-- END PORTFOLIO VIEW -->

      </div> <!-- END SCROLL AREA -->

      <!-- MOBILE NAV (BOTTOM) -->
      <nav class="mobile-nav">
        <div class="nav-item active" id="nav-market-mobile" onclick="switchTab('market')">📊</div>
        <div class="nav-item" id="nav-portfolio-mobile" onclick="switchTab('portfolio')">💼</div>
        <div class="nav-item" style="color:var(--accent-danger);" onclick="handleLogout()">🔒</div>
      </nav>

    </main>
  </div>

  <script src="script.js?v=3"></script>
</body>

</html>
