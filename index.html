<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>StockAI Pro | Institutional Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://s3.tradingview.com/tv.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

    :root {
      /* Institutional Palette */
      --bg-ultra: #02040a;
      --sidebar-bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.7);
      /* Glass-ready */
      --accent-glow: #2f81f7;
      --accent-soft: rgba(47, 129, 247, 0.15);
      --border-color: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --success: #3fb950;
      --danger: #f85149;
      --warning: #d29922;
      --nav-height: 70px;

      /* New Premium Tokens */
      --glass-border: rgba(255, 255, 255, 0.08);
      --neon-blue: #58a6ff;
      --terminal-green: #3fb950;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg-ultra);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== LAYOUT ===== */
    .terminal-container {
      display: grid;
      grid-template-columns: 70px 1fr;
      height: 100vh;
      width: 100%;
    }

    /* Side Navigation (Desktop) */
    .nav-rail {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 25px;
      z-index: 100;
    }

    /* Bottom Navigation (Mobile) */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      width: 100%;
      height: var(--nav-height);
      background: var(--sidebar-bg);
      border-top: 1px solid var(--border-color);
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-rail .icon,
    .mobile-nav .icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1.4rem;
      transition: all 0.2s ease;
    }

    .icon.active {
      background: var(--accent-soft);
      color: var(--accent-glow);
      box-shadow: 0 0 15px var(--accent-soft);
    }

    .main-stage {
      overflow-y: auto;
      height: 100vh;
      background: #010409;
      padding-bottom: 80px;
      /* Space for mobile nav */
    }

    /* ===== HEADER & SEARCH ===== */
    .ticker-header {
      width: 100%;
      height: 42px;
      border-bottom: 1px solid var(--border-color);
      background: #000;
      flex-shrink: 0;
    }

    .terminal-header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .search-group {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 6px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .search-group:focus-within {
      border-color: var(--accent-glow);
      box-shadow: 0 0 20px rgba(47, 129, 247, 0.2), inset 0 2px 4px rgba(0, 0, 0, 0.5);
      transform: translateY(-1px);
    }

    .search-group input {
      background: transparent;
      border: none;
      color: white;
      padding: 8px 16px;
      width: 220px;
      outline: none;
      font-family: 'JetBrains Mono';
      font-size: .9rem;
      letter-spacing: 0.5px;
    }

    .btn-analyze {
      background: linear-gradient(135deg, var(--accent-glow), #1a56db);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(47, 129, 247, 0.3);
    }

    .btn-analyze:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(47, 129, 247, 0.5);
      filter: brightness(1.1);
    }

    .btn-analyze:active {
      transform: translateY(0);
    }

    /* ===== GRID & CARDS ===== */
    /* ===== GRID SYSTEM (ULTRA-ADVANCED) ===== */
    .terminal-layout {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      gap: 20px;
      padding: 20px;
      height: calc(100vh - var(--nav-height) - 40px);
    }

    .layout-col {
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      min-width: 0;
    }

    .main-terminal {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(88, 166, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .card-inner {
      padding: 20px;
    }

    /* ===== COMPONENTS ===== */
    .chart-container {
      width: 100%;
      height: 500px;
      background: #000;
    }

    #tv-chart-main {
      width: 100%;
      height: 100%;
    }

    .news-header {
      display: flex;
      justify-content: space-between;
      font-size: .7rem;
      letter-spacing: 1px;
      font-weight: 800;
      padding: 12px 15px;
      background: #1e222d;
      border-bottom: 1px solid #334155;
    }

    #news-container {
      flex: 1;
      width: 100%;
      min-height: 300px;
    }

    #movers-container {
      height: 350px;
      width: 100%;
    }

    .hidden {
      display: none !important;
    }

    .view-fade {
      animation: viewFadeIn 0.4s ease;
    }

    @keyframes viewFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== LEDGER SYSTEM ===== */
    .ledger-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ledger-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 0.5fr;
      padding: 15px;
      color: var(--text-secondary);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .ledger-row-div {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 0.5fr;
      padding: 15px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      align-items: center;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .ledger-row-div:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: scale(1.005);
      border-color: rgba(47, 129, 247, 0.3);
    }

    @media (max-width: 900px) {
      .ledger-header {
        display: none;
      }

      .ledger-row-div {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 20px;
      }

      .ledger-row-div .cell-security {
        grid-column: 1 / -1;
      }

      .ledger-row-div .cell-status {
        display: none;
      }

      .ledger-row-div .cell-price {
        font-size: 1.1rem;
        font-weight: bold;
      }

      .ledger-row-div .cell-change {
        text-align: right;
      }

      .ledger-row-div .cell-action {
        grid-column: 1 / -1;
        margin-top: 10px;
      }

      .ledger-row-div .cell-action button {
        width: 100%;
        padding: 10px;
      }
    }

    /* ===== MOBILE OVERRIDES ===== */
    /* ===== MOBILE & TABLET OVERRIDES ===== */
    @media (max-width: 1200px) {
      .terminal-layout {
        grid-template-columns: 300px 1fr;
      }

      .intel-col {
        display: none;
      }

      /* Hide news on tablets by default or move it */
    }

    @media (max-width: 900px) {
      .terminal-layout {
        display: block;
        padding: 15px;
        height: auto;
      }

      .terminal-container {
        grid-template-columns: 1fr;
      }

      .nav-rail {
        display: none;
      }

      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 20px;
        left: 20px;
        right: 20px;
        height: 64px;
        background: rgba(13, 17, 23, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        justify-content: space-around;
        align-items: center;
        z-index: 1000;
        padding: 0 10px;
      }

      .mobile-nav .icon {
        width: 100%;
        height: 100%;
        background: transparent;
        border-radius: 16px;
        font-size: 1.2rem;
        transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .mobile-nav .icon.active {
        background: var(--accent-soft);
        color: var(--accent-glow);
        box-shadow: none;
      }

      .main-stage {
        height: 100vh;
        padding-bottom: 110px;
        /* Space for floating nav */
      }

      .terminal-layout {
        display: flex;
        flex-direction: column;
        padding: 15px;
        height: auto;
        overflow-y: visible;
      }

      .layout-col,
      .main-terminal {
        width: 100%;
        margin-bottom: 20px;
        order: unset;
      }

      #card-chart {
        order: 1;
      }

      #card-signal {
        order: 2;
        margin-top: 10px;
      }

      #card-news {
        order: 3;
      }

      #card-movers {
        order: 4;
      }

      .terminal-header {
        padding: 20px;
        flex-direction: column;
        gap: 15px;
        background: var(--bg-ultra);
        text-align: center;
      }

      .search-group {
        width: 100%;
      }

      .search-group input {
        width: 100%;
        font-size: 1rem;
      }

      .chart-container {
        height: 40vh;
        border-radius: 12px;
      }

      /* Tactile Feedback */
      .btn-analyze:active,
      .mobile-nav .icon:active,
      .ledger-row:active {
        transform: scale(0.96);
        filter: brightness(0.9);
      }

      /* Skeleton Loading Animation */
      @keyframes skeleton-pulse {
        0% {
          background-position: 200% 0;
        }

        100% {
          background-position: -200% 0;
        }
      }

      .skeleton {
        background: linear-gradient(90deg, #161b22 25%, #1c2128 50%, #161b22 75%);
        background-size: 200% 100%;
        animation: skeleton-pulse 1.5s infinite;
        border-radius: 8px;
      }
    }

    /* Mobile Only Elements */
    .mobile-stats-banner {
      display: none;
      padding: 15px;
      background: linear-gradient(90deg, var(--accent-soft), transparent);
      border-radius: 12px;
      margin-bottom: 20px;
      border-left: 3px solid var(--accent-glow);
      border: 1px solid var(--glass-border);
    }

    @media (max-width: 900px) {
      .mobile-stats-banner {
        display: block;
      }
    }

    /* ===== AI SIGNAL STYLING ===== */
    .signal-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      margin: 15px 0;
      position: relative;
      overflow: hidden;
    }

    .signal-box::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(47, 129, 247, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Live Pulse Animation */
    @keyframes pulse-dot {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(47, 129, 247, 0.7);
      }

      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(47, 129, 247, 0);
      }

      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(47, 129, 247, 0);
      }
    }

    .pulse-live {
      width: 8px;
      height: 8px;
      background: var(--accent-glow);
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse-dot 2s infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }
  </style>
</head>

<body id="app-root">

  <!-- LOGIN SCREEN -->
  <div id="login-screen"
    style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0d1117;z-index:9999;display:flex;justify-content:center;align-items:center;">
    <div
      style="background:#161b22;padding:40px;border-radius:16px;border:1px solid #30363d;width:350px;text-align:center;box-shadow:0 0 50px rgba(0,0,0,0.5)">
      <div style="font-size:3rem;margin-bottom:20px">💎</div>
      <h2 style="color:white;margin-bottom:10px;font-family:'Plus Jakarta Sans'">Institutional Access</h2>
      <p style="color:#8b949e;font-size:0.9rem;margin-bottom:30px">Enter secure credentials to access the terminal.</p>

      <input type="password" placeholder="Passkey (Any)"
        style="width:100%;padding:12px;background:#0d1117;border:1px solid #30363d;color:white;border-radius:6px;margin-bottom:20px;outline:none;font-family:'JetBrains Mono'">

      <button onclick="handleLogin()"
        style="width:100%;padding:12px;background:#238636;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:1rem">AUTHENTICATE</button>
    </div>
  </div>

  <div class="terminal-container" id="mainDashboard" style="display:none">

    <aside class="nav-rail">
      <div class="icon active" id="nav-market-desktop" onclick="switchTab('market')">📊</div>
      <div class="icon" id="nav-portfolio-desktop" onclick="switchTab('portfolio')">💼</div>
      <div class="icon" style="margin-top:auto;color:var(--danger)" onclick="handleLogout()">🔒</div>
    </aside>

    <nav class="mobile-nav">
      <div class="icon active" id="nav-market-mobile" onclick="switchTab('market')">📊</div>
      <div class="icon" id="nav-portfolio-mobile" onclick="switchTab('portfolio')">💼</div>
      <div class="icon" style="color:var(--danger)" onclick="handleLogout()">🔒</div>
    </nav>

    <main class="main-stage">
      <div class="ticker-header" id="ticker-container"></div>

      <header class="terminal-header">
        <div style="display:flex; align-items:center; gap:15px">
          <h2 id="header-title" style="margin:0; font-size: 1.1rem; font-weight: 800;">Market Intelligence</h2>
          <div id="backend-status-hud"
            style="display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.03); padding:4px 12px; border-radius:20px; border:1px solid rgba(255,255,255,0.05)">
            <span id="backend-status-icon" style="width:6px; height:6px; background:#8b949e; border-radius:50%"></span>
            <span id="backend-status-text"
              style="font-family:'JetBrains Mono'; font-size:0.55rem; color:#8b949e; letter-spacing:1px; text-transform:uppercase">checking...</span>
            <button onclick="wakeBackend()"
              style="background:none; border:none; color:var(--accent-glow); cursor:pointer; font-size:0.6rem; margin-left:5px; text-decoration:underline; font-family:'JetBrains Mono'">RETRY</button>
          </div>
        </div>

        <div class="search-group">
          <input id="stockSearch" placeholder="TICKER (eg: BTCUSD)">
          <button class="btn-analyze" onclick="updateView()">Execute</button>
        </div>
      </header>

      <div id="view-market">
        <div class="terminal-layout">

          <!-- COL 1: INTELLIGENCE SIDEBAR -->
          <aside class="layout-col">
            <div class="glass-card" id="card-signal">
              <div class="card-inner">
                <div style="font-size:.65rem; color:var(--text-secondary); letter-spacing: 1px; font-weight:bold">NEURAL
                  CORE SIGNAL</div>
                <div class="signal-box">
                  <div id="predictVal"
                    style="font-size:1.5rem; font-weight:900; color:var(--text-secondary); text-align:center">STANDBY
                  </div>
                  <div id="predictMeta"
                    style="font-size:.7rem; color:var(--text-secondary); margin-top:5px; text-align:center">Awaiting
                    Data...</div>
                </div>
                <div
                  style="font-size:.75rem; display:flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
                  <span>Confidence:</span>
                  <span id="ai-prob" style="font-family:'JetBrains Mono'; color:var(--accent-glow)">--</span>
                </div>
              </div>
            </div>

            <div class="glass-card" id="card-movers" style="flex: 1; display: flex; flex-direction: column;">
              <div class="card-inner" style="flex: 1; display: flex; flex-direction: column;">
                <div class="news-header">
                  <span>MARKET MOVERS</span>
                  <span class="pulse-live"></span>
                </div>
                <div id="movers-container" style="flex: 1; min-height: 200px;"></div>
              </div>
            </div>
          </aside>

          <!-- COL 2: TERMINAL CORE -->
          <section class="main-terminal">
            <div class="glass-card" id="card-chart" style="flex: 1; display: flex; flex-direction: column;">
              <div class="card-inner" style="flex: 1; display: flex; flex-direction: column;">
                <div class="news-header" style="margin-bottom: 5px;">
                  <span id="terminal-symbol">TERMINAL_v2.1</span>
                  <span style="font-size: 0.6rem; color: var(--success)">LIVE_FEED</span>
                </div>
                <div id="tv-chart-main" class="chart-container" style="flex: 1; min-height: 300px;"></div>
              </div>
            </div>
          </section>

          <!-- COL 3: NEWS WIRE -->
          <aside class="layout-col">
            <div class="glass-card" id="card-news" style="height: 100%; display: flex; flex-direction: column;">
              <div class="card-inner" style="flex: 1; display: flex; flex-direction: column;">
                <div class="news-header">
                  <span>INSTITUTIONAL WIRE</span>
                  <span class="pulse-live"></span>
                </div>
                <div id="news-container" style="flex: 1; overflow-y: auto;"></div>
              </div>
            </div>
          </aside>

        </div>
      </div>

      <div id="view-portfolio" class="hidden">
        <div class="content-grid" style="grid-template-columns: 1fr;">
          <div class="glass-card">
            <div class="card-inner">
              <div
                style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px; flex-wrap: wrap; gap: 10px;">
                <h2 style="margin:0">Asset Ledger</h2>
                <div class="search-group">
                  <input id="assetInput" placeholder="ADD SYMBOL...">
                  <button class="btn-analyze" onclick="addAsset()">Add</button>
                </div>
              </div>

              <div class="ledger-container">
                <div class="ledger-header">
                  <div>Security</div>
                  <div>Status</div>
                  <div>Price</div>
                  <div>Change</div>
                  <div>Action</div>
                </div>
                <div id="assetTable"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="script.js"></script>

</body>

</html>
