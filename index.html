<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StockAI Pro | Global Institutional Terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

:root {
  --bg-ultra:#02040a;
  --sidebar-bg:#0d1117;
  --card-bg:#0d1117;
  --accent-glow:#2f81f7;
  --accent-soft:rgba(47,129,247,0.1);
  --border-color:#30363d;
  --text-primary:#f0f6fc;
  --text-secondary:#8b949e;
  --success:#238636;
  --danger:#da3633;
  --warning:#d29922;
}

*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{margin:0;background:var(--bg-ultra);color:var(--text-primary);height:100vh;overflow:hidden}

/* ===== LAYOUT ===== */
.terminal-container{display:grid;grid-template-columns:70px 1fr;height:100vh}

.nav-rail{
  background:var(--sidebar-bg);
  border-right:1px solid var(--border-color);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 0;
  gap:25px;
}
.nav-rail .icon{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;cursor:pointer;color:var(--text-secondary);font-size:1.2rem;
}
.nav-rail .icon.active{
  background:var(--accent-soft);color:var(--accent-glow);border:1px solid var(--accent-glow);
}

.main-stage{overflow-y:auto;display:flex;flex-direction:column;height:100vh;background:#010409}

.ticker-header{width:100%;height:42px;border-bottom:1px solid var(--border-color);background:#000}

.terminal-header{
  padding:10px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--sidebar-bg);
  border-bottom:1px solid var(--border-color);
  gap:10px;
}

.search-group{
  display:flex;background:#010409;border:1px solid var(--border-color);
  border-radius:6px;padding:2px;
}
.search-group input{
  background:transparent;border:none;color:white;padding:8px 12px;width:200px;
  outline:none;font-family:'JetBrains Mono';font-size:.8rem;
}
.btn-analyze{
  background:var(--accent-glow);color:white;border:none;border-radius:4px;
  padding:6px 15px;cursor:pointer;font-weight:700;font-size:.7rem;
}

/* ===== MOBILE MENU BUTTON ===== */
.mobile-controls{display:none}
.menu-toggle{
  background:var(--accent-soft);
  border:1px solid var(--accent-glow);
  color:var(--accent-glow);
  font-size:1.4rem;
  padding:4px 10px;
  border-radius:6px;
  cursor:pointer;
}

/* ===== GRID ===== */
.content-grid{
  display:grid;
  grid-template-columns:1fr 380px;
  gap:15px;
  padding:15px;
}

.glass-card{
  background:var(--card-bg);
  border:1px solid var(--border-color);
  border-radius:8px;
  padding:12px;
}

/* ===== CHART ===== */
.chart-container{
  width:100%;
  height:500px;
  border-radius:10px;
  overflow:hidden;
}
#tv-chart-main{width:100%;height:100%}

/* ===== NEWS ===== */
.news-header{
  display:flex;
  justify-content:space-between;
  font-size:.75rem;
  font-weight:bold;
  padding:8px 10px;
  background:#1e222d;
  border-bottom:1px solid #334155;
}
#news-container{height:350px;width:100%}

/* ===== SIDEBAR ===== */
.sidebar{
  display:flex;
  flex-direction:column;
  gap:15px;
}

/* ===== MOVERS ===== */
#movers-container{height:350px;width:100%}

/* ===== LEDGER TABLE ===== */
.ledger-table{
  width:100%;
  border-collapse:collapse;
}
.ledger-table th{
  text-align:left;
  font-size:.65rem;
  color:var(--text-secondary);
  padding:10px;
  border-bottom:1px solid var(--border-color);
}
.ledger-table td{
  padding:10px;
  border-bottom:1px solid #161b22;
  font-size:.85rem;
}
.ledger-row:hover{background:rgba(255,255,255,.03)}

.hidden{display:none}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .mobile-controls{display:block}
  .content-grid{grid-template-columns:1fr;padding:6px}
  .chart-container{height:60vh;min-height:420px}

  .sidebar{
    position:fixed;
    top:0;
    right:-100%;
    width:80%;
    height:100vh;
    background:var(--sidebar-bg);
    z-index:999;
    padding:12px;
    transition:.3s ease-in-out;
    box-shadow:-10px 0 30px rgba(0,0,0,.6);
  }
  .sidebar.active{right:0}

  .search-group{width:100%}
  .search-group input{width:100%}
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:10px}
</style>
</head>
<body>

<div class="terminal-container" id="mainDashboard">

  <aside class="nav-rail">
    <div class="icon active" id="nav-market" onclick="switchTab('market')">📊</div>
    <div class="icon" id="nav-portfolio" onclick="switchTab('portfolio')">💼</div>
    <div class="icon" style="margin-top:auto;color:red" onclick="location.reload()">🔒</div>
  </aside>

  <main class="main-stage">
    <div class="ticker-header" id="ticker-container"></div>

    <header class="terminal-header">
      <div class="mobile-controls">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      </div>

      <h2 id="header-title">Market Intelligence</h2>

      <div class="search-group">
        <input id="stockSearch" placeholder="SEARCH TICKER...">
        <button class="btn-analyze" onclick="updateView()">Execute</button>
      </div>
    </header>

    <!-- ===== MARKET VIEW ===== -->
    <div id="view-market">

      <div class="content-grid">

        <div class="main-terminal">
          <div class="chart-container">
            <div id="tv-chart-main"></div>
          </div>

          <div class="glass-card">
            <div class="news-header">
              <span>INSTITUTIONAL NEWS WIRE</span>
              <span style="color:#2962ff">LIVE FEED</span>
            </div>
            <div id="news-container"></div>
          </div>
        </div>

        <aside class="sidebar" id="sidebarMenu">

          <div class="glass-card">
            <div style="font-size:.7rem;color:gray">NEURAL CORE SIGNAL</div>
            <div id="predictVal" style="font-size:1.5rem;font-weight:bold">STANDBY</div>
            <div id="predictMeta" style="font-size:.7rem;color:gray">Ready...</div>
            <div style="margin-top:10px">Neural Conf: <span id="ai-prob">--</span></div>
          </div>

          <div class="glass-card">
            <div style="font-size:.7rem;color:gray;margin-bottom:5px">MARKET MOVERS</div>
            <div id="movers-container"></div>
          </div>

        </aside>

      </div>
    </div>

    <!-- ===== ASSET LEDGER VIEW ===== -->
    <div id="view-portfolio" class="hidden" style="padding:15px">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
        <h2>Asset Ledger</h2>
        <div class="search-group">
          <input id="assetInput" placeholder="ADD SYMBOL...">
          <button class="btn-analyze" onclick="addAsset()">Add</button>
        </div>
      </div>

      <div class="glass-card">
        <table class="ledger-table">
          <thead>
            <tr>
              <th>Security</th>
              <th>Status</th>
              <th>Price</th>
              <th>Change</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="assetTable"></tbody>
        </table>
      </div>

    </div>

  </main>
</div>

<script>
let currentTicker="NASDAQ:AAPL";
let myAssets = JSON.parse(localStorage.getItem("stockai_ledger")) || ["AAPL","NVDA","TSLA","BTCUSD"];

/* ===== MOBILE SIDEBAR ===== */
function toggleSidebar(){
  document.getElementById("sidebarMenu").classList.toggle("active");
}

/* ===== TAB SWITCH ===== */
function switchTab(tab){
  document.getElementById("view-market").classList.toggle("hidden", tab!=="market");
  document.getElementById("view-portfolio").classList.toggle("hidden", tab!=="portfolio");

  document.getElementById("nav-market").classList.toggle("active", tab==="market");
  document.getElementById("nav-portfolio").classList.toggle("active", tab==="portfolio");

  document.getElementById("header-title").innerText = tab==="market" ? "Market Intelligence" : "Asset Ledger";
}

/* ===== TICKER ===== */
function initTicker(){
  const script=document.createElement("script");
  script.src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js";
  script.async=true;
  script.innerHTML=JSON.stringify({
    symbols:[
      {proName:"NASDAQ:AAPL"},
      {proName:"NASDAQ:NVDA"},
      {proName:"NASDAQ:TSLA"},
      {proName:"BITSTAMP:BTCUSD"}
    ],
    colorTheme:"dark",
    isTransparent:true,
    displayMode:"adaptive",
    locale:"en"
  });
  document.getElementById("ticker-container").appendChild(script);
}

/* ===== MOVERS ===== */
function initMovers(){
  const container=document.getElementById("movers-container");
  container.innerHTML="";
  const script=document.createElement("script");
  script.src="https://s3.tradingview.com/external-embedding/embed-widget-hotlists.js";
  script.async=true;
  script.innerHTML=JSON.stringify({
    colorTheme:"dark",
    exchange:"US",
    showChart:false,
    width:"100%",
    height:"100%",
    isTransparent:true
  });
  container.appendChild(script);
}

/* ===== NEWS ===== */
function injectNews(symbol){
  const container=document.getElementById("news-container");
  container.innerHTML="";
  const script=document.createElement("script");
  script.src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js";
  script.async=true;
  script.innerHTML=JSON.stringify({
    feedMode:"symbol",
    symbol:symbol,
    isTransparent:true,
    displayMode:"regular",
    width:"100%",
    height:"100%",
    colorTheme:"dark",
    locale:"en"
  });
  container.appendChild(script);
}

/* ===== CHART + AI ===== */
function updateView(){
  const ticker=document.getElementById("stockSearch").value || currentTicker;
  currentTicker=ticker;

  new TradingView.widget({
    autosize:true,
    symbol:ticker,
    interval:"D",
    theme:"dark",
    container_id:"tv-chart-main"
  });

  injectNews(ticker);

  const val=document.getElementById("predictVal");
  val.innerText="ANALYZING...";
  setTimeout(()=>{
    const isUp=Math.random()>0.5;
    val.innerText=isUp?"STRONG BUY":"REDUCE";
    val.style.color=isUp?"lime":"red";
    document.getElementById("ai-prob").innerText=(Math.random()*15+80).toFixed(2)+"%";
  },1000);
}

/* ===== LEDGER ===== */
function renderLedger(){
  const body=document.getElementById("assetTable");
  body.innerHTML="";
  myAssets.forEach((asset,index)=>{
    const price=(Math.random()*500+100).toFixed(2);
    const change=(Math.random()*4-2).toFixed(2);
    body.innerHTML+=`
      <tr class="ledger-row">
        <td onclick="viewSymbol('${asset}')" style="cursor:pointer;color:var(--accent-glow);font-weight:bold">${asset}</td>
        <td>TRACKING</td>
        <td>$${price}</td>
        <td style="color:${change>=0?'lime':'red'}">${change}%</td>
        <td><button onclick="removeAsset(${index})" style="background:none;border:1px solid red;color:red;padding:3px 6px;font-size:.6rem">REMOVE</button></td>
      </tr>`;
  });
  localStorage.setItem("stockai_ledger", JSON.stringify(myAssets));
}

function addAsset(){
  const val=document.getElementById("assetInput").value.toUpperCase().trim();
  if(val && !myAssets.includes(val)){
    myAssets.push(val);
    renderLedger();
    document.getElementById("assetInput").value="";
  }
}

function removeAsset(index){
  myAssets.splice(index,1);
  renderLedger();
}

function viewSymbol(symbol){
  document.getElementById("stockSearch").value=symbol;
  switchTab("market");
  updateView();
}

/* ===== INIT ===== */
initTicker();
initMovers();
renderLedger();
updateView();
</script>

</body>
</html>
